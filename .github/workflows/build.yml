name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Generate Icon
        run: python make_icon.py

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name "BodyMotion" --icon=icon.ico main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BodyMotion-exe
          path: dist/BodyMotion.exe
